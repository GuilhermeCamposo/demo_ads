        enabled: true  

      # 2.1.0--0.12.22
      - package: oci://quay.io/rhdh/backstage-plugin-kubernetes@sha256:fea58ab0ebbf5af25226cea51de053634cb64c5f3d0b456296ab5021394e7616
        enabled: true

      # 2.1.0--0.21.10
      - package: oci://quay.io/rhdh/backstage-plugin-kubernetes-backend@sha256:2ec1504a86309b4dea0d28f3b46eb1ab8f268d873a61f536bb71ecbfa2c67311
        enabled: true     

       # 2.1.0--2.21.0
      - package: oci://quay.io/rhdh/backstage-plugin-kubernetes-backend@sha256:2ec1504a86309b4dea0d28f3b46eb1ab8f268d873a61f536bb71ecbfa2c67311
        enabled: true     

      # 2.1.0--0.9.13
      - package: oci://quay.io/rhdh/backstage-plugin-scaffolder-backend-module-github@sha256:c72db128e9629caac01d17bab29c1c335e24fbe8e38df4f93ecd67779460e06d
        enabled: true      

      # 2.1.0--3.0.7
      - package: oci://quay.io/rhdh/backstage-community-plugin-topology@sha256:8ffdbc13b12a6611a8716118e85de271a6c960ec7904469c8b9a3b7c60fed787
        enabled: true

      - package: ref://backstage-community-plugin-catalog-backend-module-keycloak
        enabled: true

      - package: oci://quay.io/rhdh/backstage-community-plugin-auth-backend-module-keycloak-provider:{{inherit}}
        enabled: true

    # TECH PREVIEW PLUGINS

      # 2.1.0--0.5.20
      - package: oci://quay.io/rhdh/backstage-plugin-notifications@sha256:1624f73ef08a41c4808c46eeec84d35779a3ee86aac9fb5deb168974011cde70
        enabled: true

      # 2.1.0--0.6.8
      - package: oci://quay.io/rhdh/backstage-plugin-notifications-backend@sha256:76ac6d260a75cd0b0690798e623b95e9943af7ed57b8355a04a641014bdf995e
        enabled: true                

    # COMMUNITY PLUGINS

      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-argocd:bs_1.54.9__3.1.3   
        enabled: true
                            
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-argocd-backend:bs_1.54.9__1.7.2
        enabled: true

      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/roadiehq-scaffolder-backend-argocd:bs_1.54.9__1.9.0
        enabled: true  
                       
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-tekton:bs_1.54.9__4.0.5
        enabled: true
        pluginConfig:
          dynamicPlugins:
            frontend:
              backstage-community.plugin-tekton:
                mountPoints:
                - config:
                    if:
                      allOf:
                      - isTektonCIAvailable
                    layout:
                      gridColumn: 1 / -1
                      gridRowStart: 1
                  importName: TektonCI
                  mountPoint: entity.page.ci/cards
